name: Release

# This workflow runs automatically when a version tag (v*) is pushed.
# CI calls this workflow directly because bot-created tags do not trigger push workflows.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: npm-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Check published version
        id: npm
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (process.env.RELEASE_TAG !== `v${version}`) throw new Error('Tag does not match package version')
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`)
          if (!response.ok && response.status !== 404) throw new Error(`npm registry returned ${response.status}`)
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${response.ok}\n`)
          JS

      - name: Publish to npm
        if: steps.npm.outputs.exists != 'true'
        run: npm publish --access public

  create-release:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: publish-npm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            install.sh
            install.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Build standalone binaries for curl install
